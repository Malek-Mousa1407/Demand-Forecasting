services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - "./backend:/app"
  dashboard:
    build: ./frontend
    ports:
      - "8501:8501"
    depends_on:
      - backend
    environment:
      - "API_URL=http://backend:8000"
    volumes:
      - "./frontend:/app"

  db:
    image: postgres:17
    environment:
      - "POSTGRES_PASSWORD=root"
    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
