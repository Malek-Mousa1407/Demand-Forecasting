services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - "./backend:/app"
    
  dashboard:
    build: ./frontend
    ports:
      - "8501:8501"
    depends_on:
      - backend
    environment:
      - API_URL=http://backend:8000
    volumes:
      - "./frontend:/app"